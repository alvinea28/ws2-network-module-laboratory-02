name: Trusted AVM delivery (instructor enablement required)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit no-change confirmation only; cleanup has its own authorized workflow
        type: choice
        options: [followup]
        default: followup
  schedule:
    - cron: '37 2 * * 2'
permissions: {}
# Repository-scoped serialization; this copy is the only writer to its AVM state.
concurrency:
  group: ws2-avm-state-${{ vars.WS2_STATE_LOCK_ID || github.repository }}
  cancel-in-progress: false
env:
  WORKSHOP_AZURE_ENABLED: ${{ vars.WORKSHOP_AZURE_ENABLED }}
  REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
  REPOSITORY_TEMPLATE: ${{ github.event.repository.is_template }}
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_USE_CLI: "false"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  PLAN_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
  APPLY_CLIENT_ID: ${{ vars.AZURE_APPLY_CLIENT_ID }}
  STATE_STORAGE_ACCOUNT: ${{ vars.STATE_STORAGE_ACCOUNT }}
  STATE_CONTAINER: ${{ vars.STATE_CONTAINER }}
  STATE_KEY: ${{ vars.STATE_KEY }}
  WS2_STATE_LOCK_ID: ${{ vars.WS2_STATE_LOCK_ID }}
  WORKLOAD_RG: ${{ vars.WORKLOAD_RG }}
  WORKLOAD_INPUTS_JSON: ${{ vars.WORKLOAD_INPUTS_JSON }}
jobs:
  preflight:
    name: Verify scoped AVM deployment policy
    if: vars.WORKSHOP_AZURE_ENABLED == 'true' && !github.event.repository.is_template && github.event.repository.private && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      operation: ${{ steps.policy.outputs.operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {operation} = await require('./scripts/avm-approval.cjs')({github,context,core,phase:'preflight'});
            const {pathToFileURL} = require('node:url');
            const {resolve} = require('node:path');
            const policy = await import(pathToFileURL(resolve('scripts/avm-policy.mjs')).href);
            policy.configuration({...process.env, OPERATION: operation});
  validation:
    name: Validate reviewed AVM revision
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - run: npm test
      - run: npm run kit:check
      - run: npm run workflow:check
      - run: npm run companion:check
      - run: node scripts/check-learner.mjs
  plan:
    name: Trusted AVM plan
    needs: [preflight, validation]
    runs-on: [self-hosted, linux, x64, ws2-trusted]
    environment: avm-plan
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      OPERATION: ${{ needs.preflight.outputs.operation }}
    outputs:
      artifact: ${{ steps.plan.outputs.artifact }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      manifest_sha256: ${{ steps.plan.outputs.manifest_sha256 }}
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify current main and same-run validation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await require('./scripts/avm-approval.cjs')({github,context,core,phase:'plan'});
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - name: OIDC init, verified AVM modules and exact scoped plan
        id: plan
        run: node scripts/avm-delivery.mjs plan
      - name: Encrypt saved plan before upload
        env:
          PLAN_ENCRYPTION_PUBLIC_KEY: ${{ vars.PLAN_ENCRYPTION_PUBLIC_KEY }}
        run: node scripts/plan-envelope.mjs seal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: .workshop/sealed/plan.enc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - if: always()
        run: node scripts/avm-delivery.mjs clean
  apply:
    name: Apply exact AVM saved plan
    needs: [preflight, plan]
    if: needs.preflight.outputs.operation == 'deploy' && needs.plan.result == 'success'
    runs-on: [self-hosted, linux, x64, ws2-trusted]
    environment: avm-apply
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_APPLY_CLIENT_ID }}
      OPERATION: ${{ needs.preflight.outputs.operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: .workshop/sealed
      - name: Verify scoped authorization and current main
        id: approval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await require('./scripts/avm-approval.cjs')({github,context,core});
      - name: Decrypt only after authorization
        env:
          PLAN_DECRYPTION_PRIVATE_KEY: ${{ secrets.PLAN_DECRYPTION_PRIVATE_KEY }}
        run: node scripts/plan-envelope.mjs open
      - name: Apply exact plan and verify real Azure configuration
        env:
          EXPECTED_PLAN_HASH: ${{ needs.plan.outputs.plan_sha256 }}
          EXPECTED_MANIFEST_HASH: ${{ needs.plan.outputs.manifest_sha256 }}
          CURRENT_MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
          GH_READ_TOKEN: ${{ github.token }}
        run: node scripts/avm-delivery.mjs apply
      - if: always()
        run: node scripts/avm-delivery.mjs clean
  followup:
    name: Confirm AVM no-change
    needs: [preflight, plan]
    if: needs.preflight.outputs.operation == 'followup' && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    env:
      PLAN_EXIT: ${{ needs.plan.outputs.exitcode }}
    steps:
      - run: |
          test "$PLAN_EXIT" = 0
          echo 'A fresh AVM followup plan reported no changes.' >> "$GITHUB_STEP_SUMMARY"
  drift:
    name: Report AVM drift without applying
    needs: [preflight, plan]
    if: always() && needs.preflight.outputs.operation == 'drift' && (needs.plan.result != 'success' || needs.plan.outputs.exitcode == '2')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      PLAN_RESULT: ${{ needs.plan.result }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const marker = '<!-- ws2-avm-drift -->';
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state:'open', per_page:100});
            const outcome = process.env.PLAN_RESULT === 'success' ? 'Drift detected' : 'Drift assessment failed or was incomplete; configuration is not verified';
            const body = `${marker}\nAgentAlvine: ${outcome}. Inspect ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId} privately. Fix through a reviewed PR and main push; never auto-approve, unlock or broaden access.`;
            const existing = issues.find(item => item.user.login === 'github-actions[bot]' && item.body?.includes(marker));
            if (existing) await github.rest.issues.createComment({...context.repo, issue_number:existing.number, body});
            else await github.rest.issues.create({...context.repo, title:'AgentAlvine - AVM drift requires review', body});
